spring.application.name=treading-plateform

server.port=${PORT:5454}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${TIDB_JDBC_URL:}
spring.datasource.username=${TIDB_USERNAME:}
spring.datasource.password=${TIDB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

stripe.api.key=${STRIPE_SECRET_KEY:}
razorpay.api.key=${RAZORPAY_KEY_ID:}
razorpay.api.secret=${RAZORPAY_KEY_SECRET:}
coingecko.api.key=${COINGECKO_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:4200}
